<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미래에셋 연금 Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .wrap { width: min(960px, calc(100% - 32px)); margin: 40px auto; }
    .header { margin-bottom: 24px; }
    .header h1 { margin: 0 0 8px; font-size: 30px; }
    .header p { margin: 0; color: #6b7280; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
    }
    .input-row { display: flex; gap: 10px; }
    input {
      flex: 1;
      padding: 15px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #4b5563; }
    button {
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .status { margin-top: 18px; color: #6b7280; font-size: 14px; }
    .result { margin-top: 22px; }
    .answer {
      padding: 18px;
      background: #f9fafb;
      border-radius: 10px;
      margin-bottom: 18px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 15px;
    }
    .source { border-top: 1px solid #e5e7eb; padding: 18px 0; }
    .source:first-of-type { border-top: 0; }
    .source-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .score { color: #6b7280; font-size: 13px; white-space: nowrap; }
    .text {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #374151;
      font-size: 14px;
      max-height: 260px;
      overflow: auto;
    }
    #messages { height: 58vh; overflow-y: auto; padding: 12px 0; }
    .message { max-width: 90%; margin: 12px 0; padding: 14px 18px; border-radius: 18px; background: #f1f5f9; overflow-wrap: anywhere; }
    .message.user { margin-left: auto; background: #173f63; color: white; }
    .message .answer { background: transparent; padding: 0; margin: 0; }
    details { margin-top: 12px; }
    summary { cursor: pointer; }
    input { min-width: 0; }
    #newChat { padding: 10px 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="header">
      <h1>미래에셋 연금 Agent</h1>
      <p>연금에 관한 궁금한 점부터 상품과 투자 계획까지, 편하게 이야기해 주세요.</p>
    </div>

    <section class="card">
      <button id="newChat">새 대화</button>
      <div id="messages" role="log" aria-label="대화 내용" aria-live="polite"></div>
      <div class="input-row">
        <input id="question" aria-label="메시지" placeholder="메시지를 입력해 주세요" />
        <button id="askBtn">보내기</button>
      </div>

      <div id="status" class="status" role="status"></div>

      <div id="result" class="result hidden">
        <div id="answer" class="answer"></div>
        <div id="sources"></div>
      </div>
    </section>
  </main>

  <script src="/static/response_normalizer.js"></script>
  <script>
    const questionInput = document.getElementById("question");
    const askBtn = document.getElementById("askBtn");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    let answer = document.getElementById("answer");
    let sources = document.getElementById("sources");
    const messages = document.getElementById("messages");
    const newChat = document.getElementById("newChat");
    let sessionContext = null;
    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = `message ${role}`;
      const content = document.createElement("div");
      content.className = "answer";
      content.textContent = text;
      bubble.appendChild(content);
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return { bubble, content };
    }
    function resetChat() {
      sessionContext = null;
      messages.replaceChildren();
      questionInput.value = "";
      status.textContent = "";
      addMessage("assistant", "안녕하세요! 연금에 대해 어떤 점이 궁금하세요? 상품을 찾거나 투자 계획을 세우는 것도 함께 도와드릴게요.");
      questionInput.focus();
    }
    function updateContext(data, question) {
      if (["system_error", "input_error", "error"].includes(data.status)) return;
      const meta = data.metadata || {};
      const updates = meta.context_updates || {};
      const previous = sessionContext || {};
      const topic = question.match(/IRP|DC|DB|연금저축/i);
      sessionContext = {
        session_id: previous.session_id || crypto.randomUUID(),
        pending_question_id: data.question_id || previous.pending_question_id || null,
        confirmed_constraints: { ...(previous.confirmed_constraints || {}), ...(updates.confirmed_constraints || {}) },
        active_intent: meta.route || data.route || previous.active_intent || null,
        last_topic: updates.last_topic || (topic && topic[0].toUpperCase()) || previous.last_topic || null,
        last_assistant_action: updates.last_assistant_action || (data.status === "clarify" ? "CLARIFY" : "ANSWER"),
        expires_at: Date.now() / 1000 + 1800
      };
      for (const key of ["missing_fields", "pending_question", "last_candidates", "selected_product", "pending_task"]) {
        sessionContext[key] = updates[key] !== undefined ? updates[key] : previous[key] ?? (["missing_fields", "last_candidates"].includes(key) ? [] : null);
      }
    }
    newChat.addEventListener("click", resetChat);
    resetChat();

    async function ask() {
      const question = questionInput.value.trim();
      if (!question || askBtn.disabled) return;

      askBtn.disabled = true;
      newChat.disabled = true;
      addMessage("user", question);
      questionInput.value = "";
      status.textContent = "답변을 준비하고 있어요...";
      result.classList.add("hidden");

      try {
        const response = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, top_k: 5, session_context: sessionContext })
        });

        if (!response.ok) {
          await response.json().catch(() => ({}));
          throw new Error("request_failed");
        }

        const data = await response.json();
        const message = addMessage("assistant", "");
        answer = message.content;
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "참고한 자료와 안내";
        details.appendChild(summary);
        sources = document.createElement("div");
        details.appendChild(sources);
        renderResponse(normalizeSearchResponse(data));
        if (sources.childElementCount) message.bubble.appendChild(details);
        updateContext(data, question);
        messages.scrollTop = messages.scrollHeight;
      } catch (error) {
        addMessage("assistant", "연결이 원활하지 않아 답변하지 못했어요. 잠시 후 다시 보내 주세요.");
        if (!questionInput.value) questionInput.value = question;
        status.textContent = "요청을 처리하지 못했습니다. 잠시 후 다시 시도해주세요.";
      } finally {
        askBtn.disabled = false;
        newChat.disabled = false;
        questionInput.focus();
      }
    }

    function renderResponse(viewModel) {
      answer.textContent = viewModel.answer;
      sources.replaceChildren();
      appendSources(viewModel.sources);
      appendListSection("Assumptions", viewModel.assumptions, formatAssumption);
      appendListSection("Limitations", viewModel.limitations, formatText);
      if (viewModel.nextAction) appendTextSection("Next Action", viewModel.nextAction);

      if (viewModel.status === "clarify") {
        status.textContent = "추가 정보가 필요합니다. 답변의 안내에 따라 조건을 알려주세요.";
      } else if (viewModel.status === "safe_stop") {
        status.textContent = "근거 검증을 위해 안전하게 중지했습니다. 다음 안내를 확인해주세요.";
      } else if (viewModel.status === "error") {
        status.textContent = "응답을 안전하게 완료하지 못했습니다. 다음 안내를 확인해주세요.";
      } else {
        status.textContent = "";
      }
    }

    function appendSources(items) {
      if (!Array.isArray(items) || items.length === 0) return;
      appendHeading("Sources / Evidence");
      items.forEach((item, index) => {
        const source = item && typeof item === "object" ? item : {};
        const el = document.createElement("div");
        el.className = "source";
        const head = document.createElement("div");
        head.className = "source-head";
        const title = document.createElement("span");
        title.textContent = `${index + 1}. ${source.title || "근거"}`;
        head.appendChild(title);
        if (source.score) {
          const score = document.createElement("span");
          score.className = "score";
          score.textContent = `score ${source.score}`;
          head.appendChild(score);
        }
        el.appendChild(head);
        if (source.detail) {
          const detail = document.createElement("div");
          detail.className = "text";
          detail.textContent = source.detail;
          el.appendChild(detail);
        }
        sources.appendChild(el);
      });
    }

    function appendListSection(title, items, formatter) {
      if (!Array.isArray(items) || items.length === 0) return;
      appendHeading(title);
      const list = document.createElement("ul");
      list.className = "text";
      items.forEach((item) => {
        const row = document.createElement("li");
        row.textContent = formatter(item);
        list.appendChild(row);
      });
      sources.appendChild(list);
    }

    function appendTextSection(title, text) {
      appendHeading(title);
      const content = document.createElement("div");
      content.className = "text";
      content.textContent = text;
      sources.appendChild(content);
    }

    function appendHeading(text) {
      const heading = document.createElement("h3");
      heading.textContent = text;
      sources.appendChild(heading);
    }

    function formatAssumption(item) {
      if (!item || typeof item !== "object") return formatText(item);
      const field = formatText(item.field);
      const value = formatText(item.value);
      const reason = formatText(item.reason);
      return [field && `${field}=${value}`, reason && `(${reason})`].filter(Boolean).join(" ") || "적용한 기본값";
    }

    function formatText(value) {
      return typeof value === "string" || typeof value === "number" || typeof value === "boolean"
        ? String(value)
        : "";
    }

    askBtn.addEventListener("click", ask);
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); ask(); }
    });
  </script>
</body>
</html>
